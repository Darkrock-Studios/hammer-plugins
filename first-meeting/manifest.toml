id = "first-meeting"
name = "First meeting"
version = "0.1.0"
api = 1
description = "Finds the first scene, in story order, with both of two characters in its References, and lists the other scenes they share, with buttons opening the first few."

[permissions]
operations = ["entry.read", "scene.tree"]

[[actions]]
name = "meet"
label = "Find where two characters first meet"
places = ["project", "entry"]
