[workspace]
resolver = "3"
members = ["name-checker", "harper-grammar", "languagetool"]
# harper-grammar builds Harper and runs Wizer, so only its own build.sh builds it.
default-members = ["name-checker", "languagetool"]

[workspace.dependencies]
# To build against an SDK checkout instead, see .cargo/config.toml.
hammer = { package = "hammer-plugin-kit", version = "0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
