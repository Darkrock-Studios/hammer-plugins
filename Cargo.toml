[workspace]
resolver = "3"
members = ["name-checker", "harper-grammar"]
# harper-grammar builds Harper and runs Wizer, so only its own build.sh builds it.
default-members = ["name-checker"]

[workspace.dependencies]
# The SDK is checked out beside this repo.
hammer = { package = "hammer-plugin-kit", path = "../hammer-plugin-sdk/rust/hammer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
