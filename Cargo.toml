[workspace]
resolver = "3"
members = ["hammer", "upper", "wordfreq", "wordcount", "style", "names", "english-grammar"]
# english-grammar builds Harper and runs Wizer, so only its own build.sh builds it.
default-members = ["hammer", "upper", "wordfreq", "wordcount", "style", "names"]

[workspace.dependencies]
hammer = { path = "hammer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
