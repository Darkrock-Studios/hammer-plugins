# .cargo/local.toml, which git ignores, can build the Rust plugins against an SDK checkout beside this repo:
#
#   [patch.crates-io]
#   hammer-plugin-kit = { path = "../hammer-plugin-sdk/rust/hammer" }
include = [{ path = "local.toml", optional = true }]

[build]
target = "wasm32-unknown-unknown"

# For plugins using the kit's `getrandom` feature, which supplies getrandom's backend.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="custom"']
