id = "real-names"
name = "Real-world names"
version = "0.1.0"
api = 1
description = "Suggests real names by culture and decade of birth, as common as they were then, and adds the ones you pick to the encyclopedia as people."

[permissions]
operations = ["entry.create"]

[[actions]]
name = "names"
label = "Generate real-world names"
output = "interactive"
places = ["project", "entry"]

[[actions.field]]
key = "culture"
type = "choice"
label = "Culture"
default = "american"
options = [
	{ value = "american", label = "American" },
]

[[actions.field]]
key = "era"
type = "choice"
label = "Born in"
default = "any"
options = [
	{ value = "any", label = "Any time" },
	{ value = "1880", label = "1880s" },
	{ value = "1890", label = "1890s" },
	{ value = "1900", label = "1900s" },
	{ value = "1910", label = "1910s" },
	{ value = "1920", label = "1920s" },
	{ value = "1930", label = "1930s" },
	{ value = "1940", label = "1940s" },
	{ value = "1950", label = "1950s" },
	{ value = "1960", label = "1960s" },
	{ value = "1970", label = "1970s" },
	{ value = "1980", label = "1980s" },
	{ value = "1990", label = "1990s" },
	{ value = "2000", label = "2000s" },
	{ value = "2010", label = "2010s" },
	{ value = "2020", label = "2020s" },
]

[[actions.field]]
key = "gender"
type = "choice"
label = "Given names"
default = "any"
options = [
	{ value = "any", label = "Any" },
	{ value = "feminine", label = "Feminine" },
	{ value = "masculine", label = "Masculine" },
]

[[actions.field]]
key = "count"
type = "int"
label = "How many"
default = 8
min = 1
max = 20

[[actions.field]]
key = "surnames"
type = "bool"
label = "With surnames"
default = true
