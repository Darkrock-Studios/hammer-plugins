id = "mcp"
name = "MCP server"
version = "0.3.0"
api = 1
description = "Lets AI agents such as Claude read your projects through the Model Context Protocol, and, if you allow it in its settings, organize them. It never writes prose."

[permissions]
# No operation that writes a scene's prose (scene.write, scene.append, draft.apply, project.import):
# Hammer's AI is a tool for the writer, not a replacement. Writes and deletes are offered as tools only
# when the plugin's settings allow them, plugin installs and removals by a setting of their own.
operations = [
	"content:read",
	"plugins:read",
	"plugin.install",
	"plugin.uninstall",
	"project.create",
	"project.rename",
	"backup.create",
	"scene.create",
	"scene.rename",
	"scene.move",
	"scene.archive",
	"scene.unarchive",
	"scene.meta.write",
	"scene.references.set",
	"draft.create",
	"note.create",
	"note.update",
	"entry.create",
	"entry.update",
	"entry.image.set",
	"entry.image.remove",
	"timeline.create",
	"timeline.update",
	"timeline.move",
	"idea.create",
	"idea.update",
	"idea.archive",
	"idea.unarchive",
	"scene.delete",
	"draft.delete",
	"note.delete",
	"entry.delete",
	"timeline.delete",
	"idea.delete",
]

[[commands]]
name = "mcp"
help = "Serves your projects to AI agents over MCP, on standard input and output."
