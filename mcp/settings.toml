[[setting]]
key = "liveEdits"
type = "bool"
label = "Let AI agents change scenes directly"
hint = "Otherwise their scene edits are saved as drafts for you to review."
default = false

[[setting]]
key = "deletes"
type = "bool"
label = "Let AI agents delete things"
hint = "Scenes, drafts, notes, encyclopedia entries, timeline events, and ideas. Never whole projects."
default = false
