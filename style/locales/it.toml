name = "Rapporto di stile"
description = "Mostra leggibilità, avverbi, parole filtro, dialogo e parole ed espressioni ripetute per ogni scena e per tutta la storia, in un documento da conservare come nota. Funziona con progetti in inglese, francese, tedesco, spagnolo, italiano e ucraino."

[actions.report]
label = "Rapporto di stile"

