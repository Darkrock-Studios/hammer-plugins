label = "Scene"
hint = "Lascia vuoto per tutta la storia."

[settings.filterWords]
label = "Parole filtro"
hint = "Contare verbi come «sentì» e «vide» che si mettono tra il lettore e la scena"

[settings.scenes]
label = "Ogni scena"
hint = "Una sezione per ogni scena dopo tutta la storia"

[settings.sceneRepeats]
label = "Ripetizioni in una scena"
hint = "Quante volte una parola ricorre in una scena prima che la scena la elenchi"

[settings.storyRepeats]
label = "Ripetizioni nella storia"
hint = "Quante volte una parola ricorre in tutta la storia prima che il rapporto la elenchi"

[settings.listSize]
