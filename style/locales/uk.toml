name = "Звіт про стиль"
description = "Показує читабельність, прислівники, слова-фільтри, діалог і повторені слова та фрази для кожної сцени й усієї історії в документі, який можна зберегти як нотатку. Працює з проєктами англійською, французькою, німецькою, іспанською, італійською та українською."

