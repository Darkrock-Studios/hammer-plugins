id = "style"
name = "Style report"
version = "0.1.0"
api = 1
description = "Reports readability, adverbs, dialogue, and repeated words and phrases for each scene and the whole story, as a document you can keep as a note."
languages = ["en"]

[permissions]
operations = ["scene.tree", "scene.read"]

[[actions]]
name = "report"
label = "Style report"
output = "document"

[[actions.field]]
key = "scenes"
type = "scenes"
label = "Scenes"
hint = "Leave empty to report on the whole story."
