name = "Проста граматика"
description = "Підкреслює помилки, які пропускає перевірка правопису, як-от «приймати участь», «на протязі року» та повторені слова, а також пробіли, великі літери й розділові знаки в діалогах англійською, французькою, німецькою, іспанською, італійською та українською. Невелика й швидка."

[diagnostics.grammar]
label = "Проста граматика"

[settings.mistakes]
label = "Помилки у словах"
hint = "Повторені слова та переплутані слова й вирази"

[settings.punctuation]
label = "Розділові знаки й великі літери"
hint = "Пробіли, подвоєні знаки, дужки й великі літери"

[settings.dialogue]
label = "Діалоги"
hint = "Коми, великі літери й пробіли в діалогах і словах автора"

[settings.wordiness]
label = "Багатослівні вирази"
hint = "Як-от «на сьогоднішній день» замість «сьогодні»"

[settings.redundancy]
label = "Надлишкові вирази"
hint = "Як-от «більш кращий» замість «кращий»"

[settings.repeatedMarks]
label = "Повторені знаки"
hint = "Як-от «!!» і «?!?»"

[settings.longSentences]
label = "Довгі речення"

[settings.longSentenceWords]
label = "Слів у довгому реченні"
hint = "Більше за це число; потрібні «Довгі речення»"
