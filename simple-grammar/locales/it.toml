name = "Grammatica semplice"
description = "Sottolinea gli errori che un correttore ortografico lascia passare, come «un amica», «c’è la faccio» e le parole ripetute, oltre a spazi, maiuscole e punteggiatura dei dialoghi, in inglese, francese, tedesco, spagnolo, italiano e ucraino. Leggero e veloce."

[diagnostics.grammar]
label = "Grammatica semplice"

[settings.mistakes]
label = "Errori di parole"
hint = "Parole ripetute e parole o espressioni confuse"

[settings.punctuation]
label = "Punteggiatura e maiuscole"
hint = "Spazi, segni doppi, parentesi e maiuscole"

[settings.dialogue]
label = "Dialoghi"
hint = "Virgole, maiuscole e spazi attorno ai dialoghi e agli incisi"

[settings.wordiness]
label = "Espressioni prolisse"
hint = "Come «al fine di» per «per»"

[settings.redundancy]
label = "Espressioni ridondanti"
hint = "Come «uscire fuori» per «uscire»"

[settings.repeatedMarks]
label = "Segni ripetuti"
hint = "Come «!!» e «?!?»"

[settings.longSentences]
label = "Frasi lunghe"

[settings.longSentenceWords]
label = "Parole in una frase lunga"
hint = "Più di queste; richiede Frasi lunghe"
