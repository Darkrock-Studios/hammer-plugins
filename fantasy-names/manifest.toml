id = "fantasy-names"
name = "Fantasy names"
version = "0.1.0"
api = 1
description = "Makes up names in a fantasy style, elvish, dwarvish, imperial, orcish, and more, most sounding like the names of an old language, and adds the ones you pick to the encyclopedia as people."

[permissions]
operations = ["entry.create"]

[[actions]]
name = "names"
label = "Generate fantasy names"
output = "interactive"
places = ["project", "entry"]

[[actions.field]]
key = "style"
type = "choice"
label = "Style"
default = "elvish"
options = [
	{ value = "elvish", label = "Elvish (Welsh)" },
	{ value = "high-elvish", label = "High Elvish (Finnish)" },
	{ value = "dwarvish", label = "Dwarvish (Old Norse)" },
	{ value = "old-kingdom", label = "Old kingdom (Old English)" },
	{ value = "imperial", label = "Imperial (Latin)" },
	{ value = "mythic", label = "Mythic (Ancient Greek)" },
	{ value = "highland", label = "Highland (Gaelic)" },
	{ value = "forest", label = "Forest (Slavic)" },
	{ value = "orcish", label = "Orcish" },
]

[[actions.field]]
key = "gender"
type = "choice"
label = "Given names"
default = "any"
options = [
	{ value = "any", label = "Any" },
	{ value = "feminine", label = "Feminine" },
	{ value = "masculine", label = "Masculine" },
]

[[actions.field]]
key = "count"
type = "int"
label = "How many"
default = 8
min = 1
max = 20

[[actions.field]]
key = "bynames"
type = "bool"
label = "With second names"
default = true
