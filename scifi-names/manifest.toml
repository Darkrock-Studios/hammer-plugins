id = "scifi-names"
name = "Sci-fi names"
version = "0.1.0"
api = 1
description = "Makes up names for science fiction, of aliens, hackers, and machines, of worlds, and of ships and companies, and adds the ones you pick to the encyclopedia."

[permissions]
operations = ["entry.create"]

[[actions]]
name = "characters"
label = "Sci-fi characters"
output = "interactive"
places = ["project", "entry"]

[[actions.field]]
key = "style"
type = "choice"
label = "Kind"
default = "harsh"
options = [
	{ value = "harsh", label = "Alien, harsh" },
	{ value = "liquid", label = "Alien, flowing" },
	{ value = "sibilant", label = "Alien, hissing" },
	{ value = "clipped", label = "Alien, clipped" },
	{ value = "handles", label = "Handle" },
	{ value = "designations", label = "Machine designation" },
]

[[actions.field]]
key = "count"
type = "int"
label = "How many"
default = 8
min = 1
max = 20

[[actions.field]]
key = "long"
type = "bool"
label = "Long form"
default = true

[[actions]]
name = "worlds"
label = "Sci-fi worlds"
output = "interactive"
places = ["project", "entry"]

[[actions.field]]
key = "style"
type = "choice"
label = "Style"
default = "stars"
options = [
	{ value = "stars", label = "Like the stars" },
	{ value = "settled", label = "Colonies and stations" },
	{ value = "catalogue", label = "Catalogue designations" },
]

[[actions.field]]
key = "count"
type = "int"
label = "How many"
default = 8
min = 1
max = 20

[[actions]]
name = "things"
label = "Sci-fi things"
output = "interactive"
places = ["project", "entry"]

[[actions.field]]
key = "style"
type = "choice"
label = "Kind"
default = "naval"
options = [
	{ value = "naval", label = "Ship, naval" },
	{ value = "lyrical", label = "Ship, lyrical" },
	{ value = "working", label = "Ship, working" },
	{ value = "corporations", label = "Company" },
]

[[actions.field]]
key = "count"
type = "int"
label = "How many"
default = 8
min = 1
max = 20

[[actions.field]]
key = "long"
type = "bool"
label = "Long form"
default = true
